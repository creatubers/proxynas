name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        shell: pwsh
        run: ./build_proxynas.ps1

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/Proxynas -DestinationPath Proxynas-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Proxynas-win64
          path: Proxynas-win64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" Proxynas-win64.zip
          --title "Proxynas ${{ github.ref_name }}"
          --notes-file .github/release-notes.md
