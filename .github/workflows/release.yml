name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        shell: pwsh
        run: ./build_proxynas.ps1

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/Proxynas -DestinationPath Proxynas-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Proxynas-win64
          path: Proxynas-win64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $tag = "${{ github.ref_name }}"
          $changelog = Get-Content .github/release-notes.md -Raw
          $section = [regex]::Match($changelog, '(?ms)^### ' + [regex]::Escape($tag) + '\r?\n(.*?)(?=^### |^---\r?$|\z)')
          if (-not $section.Success -or -not $section.Groups[1].Value.Trim()) {
            throw "Missing changelog for $tag"
          }
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notes -Value $section.Groups[1].Value.Trim() -Encoding utf8
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag Proxynas-win64.zip --clobber
            gh release edit $tag --notes-file $notes
          } else {
            gh release create $tag Proxynas-win64.zip --title "Proxynas $tag" --notes-file $notes
          }
